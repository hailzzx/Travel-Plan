<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe5cc">
  <title>在小红书查找目的地 · 西海岸旅行</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #173e2d; background: #efe5cc; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, #f8edcf, #efe5cc 53%, #e8dbc1); }
    main { width: min(100%, 520px); padding: clamp(28px, 7vw, 46px); border: 1px solid #c7b68f; border-radius: 22px; background: #fff8e8; box-shadow: 8px 9px 0 #d8c9aa; }
    .eyebrow { margin: 0 0 18px; color: #cf6539; font: 800 11px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .14em; }
    h1 { margin: 0; font: 700 clamp(29px, 8vw, 42px)/1.16 Georgia, "Songti SC", serif; letter-spacing: -.025em; }
    .keyword { display: inline-block; margin: 22px 0 0; padding: 9px 12px; border: 1px solid #cdbb99; border-radius: 6px; background: #f3ead6; font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
    .description { margin: 20px 0 25px; color: #546657; font-size: 14px; line-height: 1.7; }
    .actions { display: grid; gap: 11px; }
    .actions a { min-height: 52px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-radius: 11px; font-size: 15px; font-weight: 750; text-decoration: none; }
    .actions a::after { content: "↗"; font-size: 20px; line-height: 1; }
    .actions .app { color: #fff8e8; background: #173e2d; }
    .actions .web { border: 1px solid #d4b69d; color: #9e4d32; background: #f8e8da; }
    .hint { margin: 18px 0 0; color: #677366; font-size: 12px; line-height: 1.6; }
    .back { display: inline-block; margin-top: 28px; color: #315d50; font-size: 13px; font-weight: 750; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">WEST / 26 · TRAVEL NOTES</p>
    <h1>在小红书查找目的地</h1>
    <p class="keyword" id="keyword"></p>
    <p class="description">手机上可直接打开小红书 App 搜索；如果浏览器无法唤起 App，可以用网页搜索查看相关笔记。</p>
    <div class="actions">
      <a class="app" id="app-link" href="https://www.xiaohongshu.com/">打开小红书 App</a>
      <a class="web" id="web-link" href="https://www.baidu.com/" target="_blank" rel="noopener noreferrer">网页搜索小红书笔记</a>
    </div>
    <p class="hint">部分手机浏览器不支持小红书的网页搜索地址，因此这里提供 App 和网页两种入口。</p>
    <a class="back" href="./#itinerary">← 返回行程</a>
  </main>
  <script>
    const keyword = (new URLSearchParams(location.search).get("keyword") || "西海岸旅行").trim().slice(0, 120) || "西海岸旅行";
    document.getElementById("keyword").textContent = keyword;
    document.getElementById("app-link").href = `xhsdiscover://search/result?keyword=${encodeURIComponent(keyword)}&target_search=notes`;
    document.getElementById("web-link").href = `https://www.baidu.com/s?wd=${encodeURIComponent(`site:xiaohongshu.com ${keyword}`)}`;
  </script>
</body>
</html>
